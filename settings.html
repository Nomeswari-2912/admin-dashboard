<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#672384">
  <title>Admin Dashboard - Course Settings</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="course-window">
    <aside class="color-panel" aria-hidden="true"></aside>
    <section class="form-panel" aria-labelledby="page-title">
      <div class="form-header">
        <a class="back-link" href="/details">← Back</a>
        <img class="brand-logo" src="/assets/springboard-logo.png" alt="Springboard logo">
      </div>
      <h1 id="page-title">Admin Dashboard</h1>
      <form class="course-form settings-form">
        <div class="field">
          <label for="creator">User ID (Creator) *</label>
          <input id="creator" name="creator" type="text" required>
        </div>
        <div class="two-column">
          <div class="field">
            <label for="duration">Estimated Duration</label>
            <input id="duration" name="duration" type="text" placeholder="e.g. 6 weeks">
          </div>
          <div class="field">
            <label for="enrolled">Enrolled</label>
            <input id="enrolled" name="enrolled" type="number" min="0" step="1" value="0" aria-label="Enrolled count">
          </div>
        </div>
        <div class="field">
          <label for="rating">Rating</label>
          <input id="rating" name="rating" type="number" min="0" max="5" step="0.1" value="0" aria-label="Rating from 0 to 5">
        </div>
        <button class="round-action" type="submit" aria-label="Save course">→</button>
      </form>
    </section>
  </main>
</body>
</html>
